<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheong Woon Mexico</title>
    <style>
        /* Eliminar la barra de desplazamiento visualmente */
        ::-webkit-scrollbar {
            display: none;
        }
        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        .form-container { background: #2c2c2c; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }
        input, select { background: #3e3e3e; border: 1px solid #555; color: #fff; padding: 12px; width: 100%; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; }
        h3 { border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

/* PARTE DERECHA - LOGO Y NOMBRE DE LA EMPPRESA*/
        .branding { display: flex; align-items: center; gap: -5px; }
        .logo { 
            width: 100px;
            height: 40px;
            border-radius: 5px;
            object-fit: contain;
        }

/* Menú */
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }

/*Dashboard  */
        body {
            margin: 0px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header { height: 40px; /* Tu encabezado */ }

        main {
            flex: 1;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 250px 1fr; /* Arriba 250px, abajo lo que sobre */
            gap: 15px;
            overflow-y: auto; /* Permite scroll solo si la ventana es muy pequeña */
        }

        /* Tarjetas */
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .card h3 { color: #fff; margin: 0 0 15px 0; font-size: 0.9rem; text-transform: uppercase; }

/* CUADRO GRANDE */
        .card-bottom { grid-column: 1 / -1; }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CHEONG WOON MEXICO</h1>
        </div>

        <nav class="nav-links">
            <a href="main.html" class="active">Inicio</a>
            <a href="registro.html">Registro</a>
            <a href="portalrh.html">PortalRH</a>
        </nav>
    </header>
    <main>
        <section class="card">
            <h3>Ingresos del Mes</h3>
            <div id="lista-ingresos"></div>
        </section>

        <section class="card">
            <h3>Reclutamiento: Mes</h3>
            <div class="chart-wrapper">
                <canvas id="graficaMes"></canvas>
            </div>
        </section>

        <section class="card">
            <h3>Reclutamiento: Año</h3>
            <div class="chart-wrapper">
                <canvas id="graficaAno"></canvas>
            </div>
        </section>

        <section class="card card-bottom">
            <h3>Cumpleañeros del Mes</h3>
            <div id="lista-cumpleaneros"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Configuración base de la gráfica
        function crearGraficaHorizontal(idCanvas, datos) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['FACEBOOK', 'POSTEO', 'VOLANTE', 'RECOMENDACION', 'RECLU CW', 'RECLU PURO'],
                    datasets: [{
                        label: 'Cantidad',
                        data: datos,
                        backgroundColor: '#3498db'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { beginAtZero: true, grid: { color: '#333' } },
                        y: { ticks: { font: { size: 10 }, color: '#fff' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
        document.addEventListener("DOMContentLoaded", async () => {
            const datosMes = await fetch('/api/datos-grafica?periodo=mes').then(res => res.json());
            const datosAno = await fetch('/api/datos-grafica?periodo=ano').then(res => res.json());

            crearGraficaHorizontal('graficaMes', datosMes);
            crearGraficaHorizontal('graficaAno', datosAno);
        });
    </script>

</body>
</html>
