<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System RH CWM</title>
<style>
/* Eliminar la barra de desplazamiento visualmente */
        ::-webkit-scrollbar {
            display: none;
        }

        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        .form-container { background: #2c2c2c; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }
        input, select { background: #3e3e3e; border: 1px solid #555; color: #fff; padding: 12px; width: 100%; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; }
        h3 { border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

/* PARTE DERECHA - LOGO Y NOMBRE DE LA EMPRESA*/
        .branding { display: flex; align-items: center; gap: -5px; }
        .logo { 
            width: 100px;
            height: 40px;
            border-radius: 5px;
            object-fit: contain;
        }

/* Menú */
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }

/* Dashboard Modificado */
        main {
            flex: 1;
            padding: 5px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .dashboard-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            align-items: stretch;
        }

/* Estilos tarjetas */
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 80%;
            box-sizing: border-box;
        }

        .card h3 { 
            color: #fff; 
            margin: 0px 0px 20px 0;
            font-size: 0.9rem; 
            text-transform: uppercase; 
        }

/* --- GRAFICA DE DONA --- */
        .card-dona .filter-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
        }

        .card-dona .chart-container-wrapper {
            position: relative;
            height: 350px;
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .card-dona .custom-legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 15px;
            justify-content: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.78rem;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

/* --- TARJETA ANUAL (DERECHA) --- */
        .card-anual .chart-container-wrapper {
            position: relative;
            height: 500px; 
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .card-bottom { grid-column: 1 / -1; }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CHEONG WOON MEXICO</h1>
        </div>

        <nav class="nav-links">
            <a href="main.html" class="active">Inicio</a>
            <a href="registro.html">Registro</a>
            <a href="portalrh.html">PortalRH</a>
        </nav>
    </header>
    <main>
    <div class="dashboard-row">
        <section class="card card-dona">
            <h3>Reclutamiento por Mes</h3>
            
            <div class="filter-container">
                <select id="selectMes">
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>

            <div class="chart-container-wrapper">
                <div class="chart-wrapper" style="width: 100%; height: 100%;">
                    <canvas id="graficaPastelMes"></canvas>
                </div>
            </div>

            <div class="custom-legend">
                <div class="legend-item"><span class="legend-color" style="background: #7734EA;"></span> FACEBOOK</div>
                <div class="legend-item"><span class="legend-color" style="background: #00A7EA;"></span> POSTEO</div>
                <div class="legend-item"><span class="legend-color" style="background: #8AE800;"></span> VOLANTE</div>
                <div class="legend-item"><span class="legend-color" style="background: #FAF100;"></span> RECOMENDACION</div>
                <div class="legend-item"><span class="legend-color" style="background: #FFAA00;"></span> RECLU CW</div>
                <div class="legend-item"><span class="legend-color" style="background: #FF0061;"></span> RECLU PURO</div>
            </div>
        </section>

    </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const coloresCategorias = ['#7734EA', '#00A7EA', '#8AE800', '#FAF100', '#FFAA00', '#FF0061'];
        const labelsCategorias = ['FACEBOOK', 'POSTEO', 'VOLANTE', 'RECOMENDACION', 'RECLU CW', 'RECLU PURO'];

        let chartPastel = null;

        function crearGraficaPastel(idCanvas, datos) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            if (chartPastel) chartPastel.destroy();

            chartPastel = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labelsCategorias,
                    datasets: [{
                        data: datos,
                        backgroundColor: coloresCategorias,
                        borderWidth: 2,
                        borderColor: '#1e1e1e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const mesActual = new Date().getMonth() + 1;
            const selectMes = document.getElementById('selectMes');
            const currentHost = window.location.hostname;
            const PORT = '8001';
            const API_URL = `http://${currentHost}:${PORT}`;
            const API_BASES = [API_URL, `http://localhost:${PORT}`];

            async function fetchDatosGrafica(params) {
                for (const baseUrl of API_BASES) {
                    try {
                        const response = await fetch(`${baseUrl}/api/datos-grafica?${params}`);
                        if (!response.ok) continue;
                        return await response.json();
                    } catch (_) {
                    }
                }
                return [0, 0, 0, 0, 0, 0];
            }

            if (selectMes) {
                selectMes.value = mesActual;
            }

            try {
                    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Mexico_City';
                    const datosMesInicial = await fetchDatosGrafica(`periodo=mes&mes=${mesActual}&tz=${encodeURIComponent(tz)}`);
                crearGraficaPastel('graficaPastelMes', datosMesInicial);

                if (selectMes) {
                    selectMes.addEventListener('change', async (e) => {
                        const mesSeleccionado = e.target.value;
                        const tzChange = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Mexico_City';
                        const nuevosDatosMes = await fetchDatosGrafica(`periodo=mes&mes=${mesSeleccionado}&tz=${encodeURIComponent(tzChange)}`);
                        crearGraficaPastel('graficaPastelMes', nuevosDatosMes);
                    });
                }

            } catch (error) {
                console.error("Error cargando datos de las gráficas", error);
            }
        });
    </script>

</body>
</html
