services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: rh-system-backend:local
    build: ./backend
    restart: unless-stopped
    # env_file: .env
    environment:
      DB_WRITE_LOCK: "0"
      EMPLOYEE_DOCS_ROOT: /app/uploads
      CHATBOT_INTERNAL_URL: http://chatbot:5000
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8001:8000"

  chatbot:
    image: rh-system-backend:local
    restart: unless-stopped
    command: ["python", "/app/Chatbot_Wpp/bot.py"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PORT: "5000"
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN:-}
      WHATSAPP_NOTIFICATION_TEMPLATE_PREFIX: ${WHATSAPP_NOTIFICATION_TEMPLATE_PREFIX:-rh_aviso}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es_MX}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Chatbot_Wpp:/app/Chatbot_Wpp:ro
    ports:
      - "5002:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  pgdata:
