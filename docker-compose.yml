services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # env_file: .env
    environment:
      DB_WRITE_LOCK: "0"
      EMPLOYEE_DOCS_ROOT: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    ports:
      - "3001:80"
  # Nuevo servicio de WhatsApp
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution_api
    restart: unless-stopped
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - AUTHENTICATION_API_KEY=CwSistemasSecretKey2026!
    volumes:
      - evolution_instances:/instance
    ports:
      - "8080:8080"

volumes:
  pgdata:
  evolution_instances:
