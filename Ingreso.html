<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheong Woon Mexico</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 2px solid #444; }
        .branding { display: flex; align-items: center; gap: 10px; }
        .logo { width: 100px; height: 40px; border-radius: 5px; object-fit: contain; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: #1e1e1e; border-radius: 12px; }
        .table-container { overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; color: #fff; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        
        /* Estilos para inputs y selects */
        select, input { 
            background: #121212; color: #fff; border: 1px solid #444; 
            padding: 5px; border-radius: 4px; width: 100%; box-sizing: border-box;
        }

                /* SECCIONES DE ENCABEZADO */
        .main-header {
            display: flex;
            justify-content: space-between; /* Distribuye el espacio */
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

        /* CENTRAR MENU DE OPCIONES */
        .header-section {
            flex: 1; 
            display: flex;
            align-items: center;
        }

        .left { justify-content: flex-start; }  /* Logo a la izquierda */
        .center { justify-content: center; }    /* Menú al centro */
        .right { justify-content: flex-end; }   /* Botón a la derecha */

        /* SEPARACION DE MENU DE OPCIONES */
        .nav-links {
            gap: 40px; 
        }

        /* Botón Cerrar Sesión */
        .btn-logout {
            text-decoration: none;
            color: #ff4b4b;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #ff4b4b;
            padding: 5px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4b4b; color: white; }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CW CONNECT</h1>
        </div>
        <nav class="nav-links">
            <a href="iniciorh.html">Inicio</a>
            <a href="Ingreso.html" class="active">Ingresos</a>
            <a href="Cheong Woon.html">Cheong Woon</a>
            <a href="Kronos.html">Kronos</a>
        </nav>
        <div class="header-right">
            <a href="main.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>
    <main>
        <div class="container">
            <h3>Asignación de Puesto</h3>
            <div class="table-container">
                <table id="tabla-ingresos">
                    <thead>
                        <tr style="border-bottom: 2px solid #444;">
                            <th>Nombre</th>
                            <th>Empresa</th>
                            <th>No. Empleado</th>
                            <th>Personal</th>
                            <th>Puesto</th>
                            <th>Área</th>
                            <th>Turno</th>
                            <th>Salario</th>
                            <th>Pago</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const empleados = [{ nombre: "Juan Pérez" }];
        const cuerpo = document.getElementById('cuerpo-tabla');

        empleados.forEach(emp => {
            cuerpo.innerHTML = `
                <tr>
                    <td>${emp.nombre}</td>
                    <td>
                        <select>
                            <option value="" disabled selected>Selecciona la opcion</option>
                            <option>CHEONG WOON</option>
                            <option>KRONOS</option>
                        </select>
                    </td>
                    <td><input type="text" placeholder="Ej. 1234"></td>
                    <td>
                        <select>
                            <option value="" disabled selected>Selecciona la opcion</option>
                            <option>OPERATIVO</option>
                            <option>ADMINISTRATIVO</option>
                        </select>
                    </td>
                    <td><input type="text" placeholder="Puesto"></td>
                    <td><input type="text" placeholder="Área"></td>
                    <td>
                        <select>
                            <option value="" disabled selected>Selecciona la opcion</option>
                            <option>DÍA</option>
                            <option>NOCHE</option>
                        </select>
                    </td>
                    <td><input type="text" placeholder="$ Diario"></td>
                    <td>
                        <select>
                            <option value="" disabled selected>Selecciona la opcion</option>
                            <option>SEMANAL</option>
                            <option>QUINCENAL</option>
                            <option>MENSUAL</option>
                        </select>
                    </td>
                </tr>
            `;
        });
    </script>
</body>
</html>
