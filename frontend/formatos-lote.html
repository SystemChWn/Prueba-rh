<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CW Connect</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin: 0 0 20px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .toolbar button,
        .toolbar a {
            padding: 8px 16px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .toolbar button:hover,
        .toolbar a:hover {
            background: #1d4ed8;
        }

        .toolbar button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        #estado-documentos {
            flex: 1 1 100%;
            color: #b91c1c;
        }

        #estado-documentos:empty { display: none; }

        #documentos {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .documento-empleado {
            width: 100%;
            max-width: 900px;
            overflow: visible;
        }

        .documento-empleado iframe {
            display: block;
            width: 100%;
            border: 0;
            background: #fff;
            box-shadow: none;
        }

        @media print {
            @page {
                size: letter;
                margin: 0;
            }

            body {
                padding: 0;
                background: #fff;
            }

            .toolbar {
                display: none;
            }

            #documentos {
                display: block;
            }

            .documento-empleado {
                width: 8.5in;
                max-width: none;
                margin: 0;
                overflow: visible;
            }

            .documento-empleado:not(:last-child) {
                page-break-after: always;
                break-after: page;
            }

            .documento-empleado iframe {
                width: 8.5in;
                height: var(--print-height) !important;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <a id="btn-regresar" href="Cheong%20Woon.html">Regresar</a>
        <button id="btn-imprimir" type="button" disabled>Preparando documentos...</button>
        <span id="estado-documentos" role="status" aria-live="polite"></span>
    </header>
    <main id="documentos"></main>

    <script>
        const formatos = {
            cartacom: { titulo: 'Carta Compromiso', pagina: 'cartacom.html' },
            cartaimss: { titulo: 'Carta Patronal IMSS', pagina: 'cartaimss.html' },
            contrato: { titulo: 'Contrato Laboral', pagina: 'contrato.html' },
        };
        const parametros = new URLSearchParams(window.location.search);
        const formato = formatos[parametros.get('tipo')];
        const ids = [...new Set((parametros.get('ids') || '').split(',').filter((id) => /^\d+$/.test(id) && Number(id) > 0))];
        const returnUrl = ['Cheong Woon.html', 'Kronos.html'].includes(parametros.get('return_url'))
            ? parametros.get('return_url')
            : 'Cheong Woon.html';
        const documentos = document.getElementById('documentos');
        const estado = document.getElementById('estado-documentos');
        const botonImprimir = document.getElementById('btn-imprimir');
        const promesasCarga = [];

        document.getElementById('btn-regresar').href = encodeURI(returnUrl);

        function crearDocumento(registroId, indice) {
            const contenedor = document.createElement('section');
            contenedor.className = 'documento-empleado';
            contenedor.setAttribute('aria-label', `Documento ${indice + 1}`);

            const frame = document.createElement('iframe');
            frame.title = `${formato.titulo}, empleado ${registroId}`;
            frame.loading = 'eager';
            contenedor.append(frame);
            documentos.append(contenedor);

            const promesa = new Promise((resolve, reject) => {
                let esperaFinalizada = false;
                const timeout = window.setTimeout(
                    () => {
                        esperaFinalizada = true;
                        reject(new Error(`No cargaron los datos del empleado ${registroId}.`));
                    },
                    20000,
                );

                frame.addEventListener('load', () => {
                    try {
                        const contenido = frame.contentDocument;
                        if (!contenido) throw new Error('No se pudo leer el documento generado.');

                        const estilo = contenido.createElement('style');
                        estilo.textContent = `
                            .controls{display:none!important}
                            @media screen {
                                html,body {
                                    background:#fff!important;
                                    margin:0!important;
                                    padding:0!important;
                                    display:block!important;
                                    overflow-x:hidden!important;
                                }
                                .page {
                                    box-shadow:none!important;
                                    margin:0 auto 16px!important;
                                }
                            }
                        `;
                        contenido.head.append(estilo);
                        const linkRegresar = contenido.getElementById('btn-regresar');
                        if (linkRegresar) linkRegresar.href = encodeURI(returnUrl);

                        const esperarDatos = () => {
                            if (esperaFinalizada) return;
                            const nombre = contenido.getElementById('lbl-nombre')?.textContent.trim();
                            if (nombre && !/^_+$/.test(nombre)) {
                                const paginas = Math.max(1, contenido.querySelectorAll('.page').length);
                                frame.style.height = `${contenido.documentElement.scrollHeight}px`;
                                frame.style.setProperty('--print-height', `${paginas * 11}in`);
                                esperaFinalizada = true;
                                window.clearTimeout(timeout);
                                resolve();
                                return;
                            }
                            window.setTimeout(esperarDatos, 150);
                        };
                        esperarDatos();
                    } catch (error) {
                        window.clearTimeout(timeout);
                        reject(error);
                    }
                }, { once: true });

                frame.src = `${formato.pagina}?registro_id=${encodeURIComponent(registroId)}`;
            });
            promesasCarga.push(promesa);
        }

        if (!formato || !ids.length) {
            estado.textContent = 'No se indicó un formato o empleados válidos.';
            botonImprimir.textContent = 'No disponible';
        } else {
            document.title = formato.titulo;
            ids.forEach(crearDocumento);

            Promise.all(promesasCarga).then(() => {
                botonImprimir.disabled = false;
                botonImprimir.textContent = 'Imprimir / Guardar PDF';
            }).catch((error) => {
                estado.textContent = error.message;
                botonImprimir.textContent = 'No se pudo preparar';
            });
        }

        botonImprimir.addEventListener('click', () => window.print());
    </script>
</body>
</html>
