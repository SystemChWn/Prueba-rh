<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheong Woon Mexico</title>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            height: 100px;
            overflow: hidden;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
            height: 60px;
            box-sizing: border-box;
        }   

        .branding { display: flex; align-items: center; gap: 10px; }
        .logo { 
            width: 100px;
            height: 40px;
            border-radius: 5px;
            object-fit: contain;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }

        main {
            background: linear-gradient(rgba(18, 18, 18, 0.45), rgba(18, 18, 18, 0.65)), url('https://lh3.googleusercontent.com/d/1eE6EhkUOssI4urpPpSTUVKjx859AvtkO');
            background-size: cover;
            background-position: center;
            height: calc(100vh - 60px);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            gap: 30px;
            width: 100%;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            height: 100%;
            min-height: 0;
        }

        .dashboard-card {
            background: rgba(1, 1, 1, 0.65);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        .card-ingresos {
            flex: 1;
        }

        .card-avisos {
            flex: 1;
        }

        .card-cumpleanos {
            flex: 1;
            height: 100%;
        }

        .scrollable-content {
            overflow-y: auto;
            scrollbar-width: none;
            flex: 1;
            margin-top: 5px;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        h3 { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            padding-bottom: 8px; 
            margin-top: 0; 
            margin-bottom: 10px;
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            flex-wrap: wrap; 
            gap: 8px; 
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        h3 span.week-subtitle { 
            font-size: 0.9rem; 
            color: #aaa; 
            font-weight: normal; 
        }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CHEONG WOON MEXICO</h1>
        </div>
        <nav class="nav-links">
            <a href="main.html" class="active">Principal</a>
            <a href="portalrh.html">Login</a>
        </nav>
    </header>

    <main id="main-container">
        <!-- Columna Izquierda -->
        <div class="column">
            <div class="dashboard-card card-ingresos">
                <h3 style="display: flex; flex-direction: column; gap: 4px; align-items: stretch; margin-bottom: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <span>INGRESOS DE LA SEMANA</span>
                        <span style="color: #ffffff; font-weight: bold; font-size: 0.95rem;">¡BIENVENIDOS!</span>
                    </div>
                    <span id="week-range" class="week-subtitle"></span>
                </h3>
                <div style="overflow: visible; flex: 1; display: flex; gap: 15px;">
                    <div id="columna-1" style="flex: 1; display: flex; flex-direction: column; gap: 6px;"></div>
                    <div id="columna-2" style="flex: 1; display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
            </div>

            <div class="dashboard-card card-avisos">
                <h3>AVISOS</h3>
                <div id="avisos-rh-content" class="scrollable-content" style="font-size: 0.9rem; color: #ddd; line-height: 1.5;">
                    <p style="margin: 0; color: #aaa;">No hay avisos.</p>
                </div>
            </div>
        </div>

        <!-- Columna Derecha -->
        <div class="column">
            <div class="dashboard-card card-cumpleanos">
                <h3>
                    <span id="birthday-title">CUMPLEAÑEROS DE </span>
                </h3>
                <div id="birthdays-content" class="scrollable-content" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Cumpleaños del mes -->
                </div>
            </div>
        </div>
    </main>

    <script src="data-manager.js"></script>
    <script>
        function convertirFecha(valor) {
            const texto = String(valor || '').trim();
            if (!texto) return null;

            let partes = texto.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (partes) {
                return new Date(Number(partes[1]), Number(partes[2]) - 1, Number(partes[3]));
            }

            partes = texto.match(/^(\d{2})[/-](\d{2})[/-](\d{4})$/);
            if (partes) {
                return new Date(Number(partes[3]), Number(partes[2]) - 1, Number(partes[1]));
            }

            return null;
        }

        function esCheongWoon(empleado) {
            return String(empleado.empresa || '').trim().toUpperCase() === 'CHEONG WOON';
        }

        function obtenerNombreEmpleado(empleado) {
            return String(empleado.nombre || empleado.nombre_completo || 'Sin nombre').trim();
        }

        function obtenerRangoSemana() {
            const ahora = new Date();
            const diaSemana = ahora.getDay();
            const lunes = new Date(ahora);
            lunes.setHours(0, 0, 0, 0);
            lunes.setDate(ahora.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1));
            const viernes = new Date(lunes);
            viernes.setDate(lunes.getDate() + 4);
            return { lunes, viernes };
        }

        function obtenerFechasSemanaCalendario() {
            const { lunes, viernes } = obtenerRangoSemana();
            
            const mesesCortos = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
            const mesLunes = mesesCortos[lunes.getMonth()];
            const mesViernes = mesesCortos[viernes.getMonth()];

            return `${lunes.getDate()} ${mesLunes} - ${viernes.getDate()} ${mesViernes}`;
        }

        function obtenerMesActualMayusculas() {
            const ahora = new Date();
            const mesesLargos = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
            return mesesLargos[ahora.getMonth()];
        }

        async function cargarEmpleadosReales() {
            try {
                const respuesta = await fetch('/api/obtener-empleados/CHEONG_WOON');
                if (!respuesta.ok) throw new Error('No se pudieron cargar los empleados.');

                const empleados = await respuesta.json();
                if (window.DataManager && Array.isArray(empleados)) {
                    window.DataManager.upsertMany(empleados.map((empleado) => ({
                        ...empleado,
                        empresa: 'CHEONG WOON',
                        nombre_completo: empleado.nombre || '',
                    })));
                }
            } catch (_) {
                // Mantener la última información local si el servidor no está disponible.
            }

            cargarIngresosSemana();
            cargarCumpleanosMes();
        }

        document.getElementById('birthday-title').textContent = `CUMPLEAÑEROS DE ${obtenerMesActualMayusculas()}`;

        document.getElementById('week-range').textContent = obtenerFechasSemanaCalendario();

        function cargarIngresosSemana() {
            const col1 = document.getElementById('columna-1');
            const col2 = document.getElementById('columna-2');

            const empleados = window.DataManager ? window.DataManager.getEmpleados() : [];
            const { lunes, viernes } = obtenerRangoSemana();
            const personasIngresadas = empleados
                .filter((empleado) => {
                    const fechaIngreso = convertirFecha(empleado.fecha_ingreso || empleado.fecha_registro);
                    return esCheongWoon(empleado) && fechaIngreso && fechaIngreso >= lunes && fechaIngreso <= viernes;
                })
                .sort((a, b) => convertirFecha(a.fecha_ingreso || a.fecha_registro) - convertirFecha(b.fecha_ingreso || b.fecha_registro))
                .map(obtenerNombreEmpleado);

            if (!personasIngresadas.length) {
                col1.innerHTML = '<div style="font-size: 0.85rem; color: #aaa; padding: 2px 0;">No hay ingresos esta semana.</div>';
                col2.innerHTML = '';
                return;
            }

            const mitad = Math.ceil(personasIngresadas.length / 2);
            const grupo1 = personasIngresadas.slice(0, mitad);
            const grupo2 = personasIngresadas.slice(mitad);

            let html1 = "";
            grupo1.forEach(nombre => {
                html1 += `<div style="font-size: 0.85rem; color: #ddd; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">• ${nombre}</div>`;
            });

            let html2 = "";
            grupo2.forEach(nombre => {
                html2 += `<div style="font-size: 0.855rem; color: #ddd; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">• ${nombre}</div>`;
            });

            col1.innerHTML = html1;
            col2.innerHTML = html2;
        }
        function escaparHtml(valor) {
            return String(valor || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function cargarAvisosRh() {
            const contenedor = document.getElementById('avisos-rh-content');
            try {
                const currentHost = window.location.hostname;
                const apiBases = ['', `http://${currentHost}:8001`, 'http://localhost:8001'];
                let datos = null;
                for (const base of apiBases) {
                    try {
                        const endpoint = `${base}/api/shared-events`;
                        const respuesta = await fetch(endpoint);
                        if (respuesta.ok) {
                            datos = await respuesta.json();
                            break;
                        }
                    } catch (_) {
                        // Intentar la siguiente ruta disponible.
                    }
                }
                if (!datos) throw new Error('No se pudieron cargar los avisos.');
                const avisos = (Array.isArray(datos.eventos) ? datos.eventos : [])
                    .filter((evento) => String(evento.tipo || '').toLowerCase() === 'aviso')
                    .map((evento) => String(evento.descripcion || '').trim())
                    .filter(Boolean);
                contenedor.innerHTML = avisos.length
                    ? avisos.map((aviso) => `<p style="margin: 0 0 8px 0; white-space: pre-wrap;">• ${escaparHtml(aviso)}</p>`).join('')
                    : '<p style="margin: 0; color: #aaa;">No hay avisos.</p>';
            } catch (_) {
                contenedor.innerHTML = '<p style="margin: 0; color: #aaa;">No hay avisos.</p>';
            }
        }

        async function cargarCumpleanosMes() {
            const contenedor = document.getElementById('birthdays-content');

            const ahora = new Date();
            const cumpleanerosEmpleados = (window.DataManager ? window.DataManager.getEmpleados() : [])
                .filter((empleado) => {
                    const fechaNacimiento = convertirFecha(empleado.fecha_nacimiento);
                    return esCheongWoon(empleado) && fechaNacimiento && fechaNacimiento.getMonth() === ahora.getMonth();
                })
                .sort((a, b) => convertirFecha(a.fecha_nacimiento).getDate() - convertirFecha(b.fecha_nacimiento).getDate())
                .map((empleado) => {
                    const fecha = convertirFecha(empleado.fecha_nacimiento);
                    return {
                        nombre: obtenerNombreEmpleado(empleado),
                        dia: fecha.getDate(),
                        fecha: `${fecha.getDate()} de ${obtenerMesActualMayusculas().toLowerCase()}`,
                    };
                });

            let cumpleanerosCalendario = [];
            try {
                const respuesta = await fetch('/api/shared-events');
                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    cumpleanerosCalendario = (Array.isArray(datos.eventos) ? datos.eventos : [])
                        .filter((evento) => String(evento.tipo || '').toLowerCase() === 'cumpleanos')
                        .map((evento) => {
                            const partes = String(evento.monthDay || evento.month_day || '').match(/^(\d{2})-(\d{2})$/);
                            if (!partes || Number(partes[2]) - 1 !== ahora.getMonth()) return null;
                            return {
                                nombre: String(evento.title || '').trim() || 'Cumpleaños',
                                dia: Number(partes[1]),
                                fecha: `${Number(partes[1])} de ${obtenerMesActualMayusculas().toLowerCase()}`,
                            };
                        })
                        .filter(Boolean);
                }
            } catch (_) {
                // El calendario es complementario; los cumpleaños de empleados siguen disponibles.
            }

            const cumpleanerosMes = [...cumpleanerosEmpleados, ...cumpleanerosCalendario]
                .sort((a, b) => {
                    const diaA = a.dia || convertirFecha(a.fecha_nacimiento)?.getDate() || 0;
                    const diaB = b.dia || convertirFecha(b.fecha_nacimiento)?.getDate() || 0;
                    return diaA - diaB;
                });

            let html = "";
            cumpleanerosMes.forEach(c => {
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.06); padding: 12px 15px; border-radius: 8px; flex-shrink: 0;">
                        <span style="font-size: 0.9rem;">${escaparHtml(c.nombre)}</span>
                        <span style="color: #ffffff; font-weight: bold; font-size: 0.9rem;">${escaparHtml(c.fecha)}</span>
                    </div>
                `;
            });
            contenedor.innerHTML = html || '<div style="font-size: 0.9rem; color: #aaa;">No hay cumpleaños este mes.</div>';
        }
        cargarEmpleadosReales();
        cargarAvisosRh();

        if (window.DataManager) {
            window.DataManager.subscribeVistas(() => {
                document.getElementById('week-range').textContent = obtenerFechasSemanaCalendario();
                document.getElementById('birthday-title').textContent = `CUMPLEAÑEROS DE ${obtenerMesActualMayusculas()}`;
                cargarEmpleadosReales();
            });
        }
    </script>
</body>
</html>
