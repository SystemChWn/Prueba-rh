<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheong Woon Mexico</title>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            height: 100vh;
            overflow: hidden;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
            height: 60px;
            box-sizing: border-box;
        }

        .branding { display: flex; align-items: center; gap: 10px; }
        .logo { 
            width: 100px;
            height: 40px;
            border-radius: 5px;
            object-fit: contain;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }

        main {
            background: linear-gradient(rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.75)), url('https://lh3.googleusercontent.com/d/1eE6EhkUOssI4urpPpSTUVKjx859AvtkO');
            background-size: cover;
            background-position: center;
            height: calc(100vh - 60px);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            height: 100%;
            min-height: 0;
        }

        .dashboard-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        .card-ingresos {
            flex: 1.2;
        }

        .card-avisos {
            flex: 0.8;
        }

        .card-cumpleanos {
            flex: 1;
            height: 100%;
        }

        .scrollable-content {
            overflow-y: auto;
            scrollbar-width: none;
            flex: 1;
            margin-top: 5px;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        h3 { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            padding-bottom: 8px; 
            margin-top: 0; 
            margin-bottom: 10px;
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            flex-wrap: wrap; 
            gap: 8px; 
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        h3 span.week-subtitle { 
            font-size: 0.9rem; 
            color: #aaa; 
            font-weight: normal; 
        }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CHEONG WOON MEXICO</h1>
        </div>
        <nav class="nav-links">
            <a href="main.html" class="active">Principal</a>
            <a href="portalrh.html">Login</a>
        </nav>
    </header>

    <main id="main-container">
        <!-- Columna Izquierda -->
        <div class="column">
            <div class="dashboard-card card-ingresos">
                <h3>
                    <span>Ingresos de la Semana</span>
                    <span style="color: #007bff; font-weight: bold;">¡Bienvenidos!</span>
                    <span id="week-range" class="week-subtitle"></span>
                </h3>
                <div id="weekly-income-content" class="scrollable-content" style="display: flex; flex-direction: column; gap: 6px;">
                    <!-- Nombres dinámicos -->
                </div>
            </div>

            <div class="dashboard-card card-avisos">
                <h3>📢 Avisos de Recursos Humanos</h3>
                <div class="scrollable-content" style="font-size: 0.9rem; color: #ddd; line-height: 1.5;">
                    <p style="margin: 0 0 8px 0;">• Recuerda registrar tu asistencia a la hora de entrada.</p>
                    <p style="margin: 0;">• Entrega de documentos pendientes en oficinas de RH.</p>
                </div>
            </div>
        </div>

        <!-- Columna Derecha -->
        <div class="column">
            <div class="dashboard-card card-cumpleanos">
                <h3>
                    Cumpleaños del Mes 
                    <span id="birthday-month-subtitle" class="week-subtitle"></span>
                </h3>
                <div id="birthdays-content" class="scrollable-content" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Cumpleaños del mes -->
                </div>
            </div>
        </div>
    </main>

    <script>
        function obtenerFechasSemanaCalendario() {
            const ahora = new Date();
            const diaSemana = ahora.getDay();
            const diffLunes = ahora.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
            const lunes = new Date(new Date().setDate(diffLunes));
            const viernes = new Date(lunes);
            viernes.setDate(lunes.getDate() + 4);
            
            const mesesCortos = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
            const mesLunes = mesesCortos[lunes.getMonth()];
            const mesViernes = mesesCortos[viernes.getMonth()];

            return `(del ${lunes.getDate()} de ${mesLunes} al ${viernes.getDate()} de ${mesViernes})`;
        }

        document.getElementById('week-range').textContent = obtenerFechasSemanaCalendario();
        document.getElementById('birthday-month-subtitle').textContent = obtenerMesActualMayusculas();

        function cargarIngresosSemana() {
            const contenedor = document.getElementById('weekly-income-content');
            const personasIngresadas = [
                "Carlos Pérez", "María Gómez", "Juan López", 
                "Ana Torres", "Luis Ramírez", "Sofía Martínez"
            ];

            let html = "";
            personasIngresadas.forEach(nombre => {
                html += `<div style="font-size: 0.9rem; color: #ddd; padding: 3px 0;">• ${nombre}</div>`;
            });
            contenedor.innerHTML = html;
        }
        cargarIngresosSemana();

        function cargarCumpleanosMes() {
            const contenedor = document.getElementById('birthdays-content');
            
            const cumpleanerosMes = [
                { nombre: "Carlos Gómez", fecha: "3 de Agosto" },
                { nombre: "Ana Cristina Hernández", fecha: "12 de Agosto" },
                { nombre: "Mario Vazquez", fecha: "14 de Agosto" },
                { nombre: "Lucía Fernández", fecha: "19 de Agosto" },
                { nombre: "Roberto Díaz", fecha: "27 de Agosto" }
            ];

            let html = "";
            cumpleanerosMes.forEach(c => {
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.06); padding: 12px 15px; border-radius: 8px; flex-shrink: 0;">
                        <span style="font-size: 0.9rem;">${c.nombre}</span>
                        <span style="color: #ffffff; font-weight: bold; font-size: 0.9rem;">${c.fecha}</span>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }
        cargarCumpleanosMes();
    </script>
</body>
</html>
