<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Interno Reclutamiento</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
/* Eliminar la barra de desplazamiento visualmente */
        ::-webkit-scrollbar {
            display: none;
        }

        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 2px solid #444; }
        .branding { display: flex; align-items: center; gap: 10px; }
        .logo { width: 100px; height: 40px; border-radius: 5px; object-fit: contain; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }

/* SECCIONES DE ENCABEZADO */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

        .header-section {
            flex: 1; 
            display: flex;
            align-items: center;
        }

        .left { justify-content: flex-start; }
        .center { justify-content: center; }
        .right { justify-content: flex-end; }

        .nav-links {
            gap: 40px; 
        }

        /* Botón Cerrar Sesión */
        .btn-logout {
            text-decoration: none;
            color: #ff4b4b;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #ff4b4b;
            padding: 5px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4b4b; color: white; }

/* RECUADROS SUPERIORES */
        .metrics-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px 20px 0 20px;
        }

        .metric-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .metric-card h3 {
            color: #aaa;
            margin: 0 0 10px 0;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }
    </style>
    </head>
    <body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CW CONNECT</h1>
        </div>
        <nav class="nav-links">
            <a href="iniciorh.html">Inicio</a>
            <a href="Ingreso.html">Ingresos</a>
            <a href="Cheong Woon.html">Cheong Woon</a>
            <a href="Kronos.html">Kronos</a>
            <a href="asistencia.html" class="active">Asistencia</a>
        </nav>
        <div class="header-right">
            <a href="portalrh.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>
    <!-- RECUADROS SUPERIORES -->
    <div class="metrics-container">
        <div class="metric-card">
            <h3>Mes Actual</h3>
            <p class="metric-value" id="mesActual">--</p>
        </div>
        <div class="metric-card">
            <h3>Top Mensual</h3>
            <p class="metric-value" id="countPendientes">Esperando...</p>
        </div>
        <div class="metric-card">
            <h3>Fuente Destacada</h3>
            <p class="metric-value" id="countEntrevista">0</p>
        </div>
        <div class="metric-card">
            <h3>Ingresos del Mes</h3>
            <p class="metric-value" id="countEvaluando">0</p>
        </div>
    </div>
    </main>
    <script src="data-manager.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
