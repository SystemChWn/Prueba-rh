<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Interno RH</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>

        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 2px solid #444; }
        .branding { display: flex; align-items: center; gap: 10px; }
        .logo { width: 100px; height: 40px; border-radius: 5px; object-fit: contain; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }
        
        .dashboard-calendar { padding: 20px; display: flex; gap: 20px; height: 570px; }
        
        #calendar { flex: 2; background: #2c2c2c; padding: 15px; border-radius: 8px; }
        
        /* CONTENEDOR DERECHO NUEVOS RECUADROS */
        .side-panels-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-panel-card {
            flex: 1;
            background: #2c2c2c;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
        }

        .side-panel-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #fff;
            text-transform: uppercase;
        }

        .side-panel-content {
            flex: 1;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .fc { color: #fff; }
        .fc .fc-toolbar-title { text-transform: uppercase !important; }

        /* SECCIONES DE ENCABEZADO */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

        .header-section {
            flex: 1; 
            display: flex;
            align-items: center;
        }

        .left { justify-content: flex-start; }
        .center { justify-content: center; }
        .right { justify-content: flex-end; }

        .nav-links {
            gap: 40px; 
        }

        /* Botón Cerrar Sesión */
        .btn-logout {
            text-decoration: none;
            color: #ff4b4b;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #ff4b4b;
            padding: 5px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4b4b; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CW CONNECT</h1>
        </div>
        <nav class="nav-links">
            <a href="InicioReclu.html">Inicio</a>
            <a href="planeacion.html" class="active">Planeación</a>
        </nav>
        <div class="header-right">
            <a href="portalrh.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>

    <main class="dashboard-calendar">
        <div id='calendar'></div>
        
        <div class="side-panels-container">
            <!-- PANEL 2: Notas o avisos adicionales -->
            <div class="side-panel-card">
                <h3>Panel 2</h3>
                <div class="side-panel-content">
                    <p>Agregar nueva vacante</p>
                </div>
            </div>
        </div>
    </main>

    <script src="data-manager.js"></script>
    <script>
            document.addEventListener('DOMContentLoaded', function() {
                var calendarEl = document.getElementById('calendar');

                var calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'es',
                    titleFormat: { month: 'long' }, 
                    headerToolbar: { 
                        left: 'prev,next', 
                        center: 'title', 
                        right: 'today' 
                    },
                    customButtons: {
                        today: {
                            text: 'Hoy',
                            click: function() { calendar.today(); }
                        }
                    },
                    events: []
                });

                calendar.render();
            });
    </script>
</body>
</html>
