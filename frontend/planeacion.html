    <script>
        const btnGenerate = document.getElementById('btn-generate-link');
        const selectMinutes = document.getElementById('expiry-minutes');
        const linkContainer = document.getElementById('link-result-container');
        const linkText = document.getElementById('generated-link-text');

        const BASE_URL_COMPARTIBLE = `${window.location.protocol}//${window.location.hostname}${window.location.port ? ':' + window.location.port : ''}`;

        async function copiarTexto(texto) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(texto);
                return;
            }

            const helper = document.createElement('textarea');
            helper.value = texto;
            helper.setAttribute('readonly', '');
            helper.style.position = 'fixed';
            helper.style.opacity = '0';
            helper.style.left = '-9999px';
            document.body.appendChild(helper);
            helper.select();
            document.execCommand('copy');
            document.body.removeChild(helper);
        }

            } catch (err) {

            }
        });
