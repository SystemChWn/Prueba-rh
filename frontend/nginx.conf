server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index main.html;

    client_max_body_size 10M;

    charset utf-8;

    location = /main {
        return 301 /main.html;
    }

    location ~ ^/ingreso\.html$ {
        try_files /Ingreso.html =404;
    }

    location ~ ^/cheong-woon\.html$ {
        try_files /Cheong\ Woon.html =404;
    }

    location ~ ^/kronos\.html$ {
        try_files /Kronos.html =404;
    }

    location / {
        try_files $uri $uri/ /main.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
