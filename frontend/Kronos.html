<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="access-control.js"></script>
    <link rel="stylesheet" href="shared.css">
    <title>Listado de Personal: Kronos</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
/* FILTROS*/
        .filtros-container {
            display: grid;
            grid-template-columns: minmax(310px, 2fr) minmax(170px, 1fr) minmax(300px, 2fr) minmax(150px, 1fr);
            gap: 14px;
            align-items: center;
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .filtro-grupo { min-width: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .filtro-grupo.filtro-fechas { min-width: 0; }
        .filtro-grupo.filtro-fechas .filtro-input { flex: 1 1 0; width: auto; }
        .filtro-grupo.filtro-busqueda #buscador { flex: 1 1 0; width: 100% !important; }
        .filtro-grupo .filtro-input { min-width: 0; }
        .acciones-container { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #1e1e1e; padding: 16px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .acciones-menu { position: relative; }
        .acciones-menu > summary, .accion-principal, .accion-secundaria { list-style: none; background: #121212; border: 1px solid #444; color: #fff; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-family: inherit; }
        .acciones-menu > summary::-webkit-details-marker { display: none; }
        .acciones-menu > summary::after { content: " ▾"; }
        .acciones-dropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 230px; padding: 8px; background: #1e1e1e; border: 1px solid #007bff; border-radius: 8px; box-shadow: 0 8px 18px rgba(0,0,0,0.35); }
        .acciones-menu[open] .acciones-dropdown { display: grid; gap: 6px; }
        .acciones-dropdown button { text-align: left; background: transparent; border: 0; color: #fff; padding: 9px 10px; border-radius: 5px; cursor: pointer; font: inherit; }
        .acciones-dropdown button:hover, .acciones-dropdown a:hover { background: #2c2c2c; }
        .acciones-dropdown a { display: block; color: #fff; padding: 9px 10px; border-radius: 5px; text-decoration: none; }
        .seleccion-formatos { display: none; flex: 1 1 0; min-width: 0; align-items: center; gap: 12px; margin-left: 0; }
        .modo-seleccion .seleccion-column { display: table-cell; }
        .modo-seleccion .acciones-container { flex-wrap: nowrap; gap: 8px; }
        .modo-seleccion #btn-generar-formato, .modo-seleccion #btn-cancelar-formato { white-space: nowrap; }
        .seleccion-column { display: none; }
        .seleccion-contador { flex: 1; min-width: 0; color: #fff; font-size: 1.15rem; font-weight: 700; text-align: center; white-space: nowrap; }
        @media (max-width: 1100px) { .filtros-container { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 650px) { .filtros-container { grid-template-columns: 1fr; } .filtro-grupo { width: 100%; } .acciones-container { align-items: stretch; flex-direction: column; } .acciones-menu > summary, .accion-principal, .accion-secundaria { width: 100%; text-align: center; box-sizing: border-box; } .acciones-menu { width: 100%; } .acciones-dropdown { right: 0; } .seleccion-formatos { flex-wrap: wrap; } .seleccion-contador { text-align: center; } }

        /* Estilo común para todos los inputs */
        .filtro-input {
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Efecto al hacer clic (focus) */
        .filtro-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
        }

        /* Etiquetas de fecha */
        .filtro-label {
            font-size: 0.85rem;
            margin-right: 8px;
            font-weight: bold;
        }

        .btn-nombre {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-nombre:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CW CONNECT</h1>
        </div>
        <nav class="nav-links">
            <a href="iniciorh.html">Inicio</a>
            <a href="Ingreso.html">Ingresos</a>
            <a href="Cheong Woon.html">Cheong Woon</a>
            <a href="Kronos.html" class="active">Kronos</a>
            <a href="asistencia.html">Asistencia</a>
        </nav>
        <div class="header-right">
            <a href="portalrh.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>
    <main style="padding: 20px;">
        <div class="filtros-container">
            <div class="filtro-grupo filtro-busqueda">
                <input type="text" id="buscador" class="filtro-input" placeholder="🔍 Buscar por nombre o # empleado...">
            </div>
            <div class="filtro-grupo filtro-fechas">
                <span class="filtro-label">DE:</span>
                <input type="date" id="filtro-fecha-desde" class="filtro-input">
                <span class="filtro-label" style="margin-left: 15px;">A:</span>
                <input type="date" id="filtro-fecha-hasta" class="filtro-input">
            </div>
            <div class="filtro-grupo">
                <span class="filtro-label">Estatus:</span>
                <select id="filter-estatus" class="filtro-input" style="width: 180px; cursor: pointer;">
                    <option value="TODOS">Todos</option>
                    <option value="ACTIVOS">Activos</option>
                    <option value="INACTIVOS">Inactivos</option>
                </select>
            </div>
            <button id="btn-limpiar-filtros" type="button" class="filtro-input" style="width: auto; cursor: pointer;">Limpiar filtros</button>
        </div>
        <div class="acciones-container">
            <details class="acciones-menu" id="menu-formatos-automatizados">
                <summary>Formatos Automatizados</summary>
                <div class="acciones-dropdown">
                    <button type="button" data-formato="gafete">Gafete</button>
                    <button type="button" data-formato="cartacom">Carta Compromiso</button>
                    <button type="button" data-formato="cartaimss">Carta Patronal IMSS</button>
                    <button type="button" data-formato="contrato">Contrato Laboral</button>
                </div>
            </details>
            <details class="acciones-menu">
                <summary>Formatos para Imprimir</summary>
                <div class="acciones-dropdown">
                    <a href="https://drive.google.com/file/d/1IMw93o8y56e423HZoKVJNnE5z5b26e5A/view?usp=sharing" target="_blank" rel="noopener noreferrer">Suspensión</a>
                    <a href="https://drive.google.com/file/d/1MjIXgFLUJAO25hNfZb0IzTFwIW4YLvU5/view?usp=sharing" target="_blank" rel="noopener noreferrer">Entrada/Salida</a>
                    <a href="https://drive.google.com/file/d/1gWuv28J-7WjbfsaOdUMSIb0Mbb6KHRqO/view?usp=sharing" target="_blank" rel="noopener noreferrer">Indisciplina</a>
                </div>
            </details>
            <button id="btn-descargar-excel" type="button" class="accion-principal">Listado General</button>
            <div id="seleccion-formatos" class="seleccion-formatos">
                <span id="seleccion-contador" class="seleccion-contador">Selecciona un documento automatizado</span>
                <button id="btn-generar-formato" type="button" class="accion-principal">Generar formato</button>
                <button id="btn-cancelar-formato" type="button" class="accion-secundaria">Cancelar</button>
            </div>
        </div>
        
        <table style="width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px;">
            <thead>
                <tr style="border-bottom: 2px solid #444;">
                    <th class="seleccion-column" style="padding: 12px;"></th>
                    <th style="padding: 12px;">No. Empleado</th>
                    <th style="padding: 12px; text-align: left;">Nombre</th>
                    <th style="padding: 12px; text-align: left;">Apellido</th>
                    <th style="padding: 12px;">Fecha Ingreso</th>
                    <th style="padding: 12px;">Área</th>
                    <th style="padding: 12px;">Turno</th>
                    <th style="padding: 12px;">Estatus</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla-empleados">
                <tr>
                    <td colspan="7" style="padding: 12px; text-align: center;">Cargando empleados...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="data-manager.js"></script>
    <script>
        const currentHost = window.location.hostname;
        const PORT = '8001';
        const API_URL = `http://${currentHost}:${PORT}`;
        const API_BASES = [API_URL, `http://localhost:${PORT}`];

        const cuerpo = document.getElementById('cuerpo-tabla-empleados');
        const buscador = document.getElementById('buscador');
        const filterEstatus = document.getElementById('filter-estatus');
        const fechaDesdeInput = document.getElementById('filtro-fecha-desde');
        const fechaHastaInput = document.getElementById('filtro-fecha-hasta');
        const btnLimpiarFiltros = document.getElementById('btn-limpiar-filtros');
        const btnDescargarExcel = document.getElementById('btn-descargar-excel');
        const seleccionFormatos = document.getElementById('seleccion-formatos');
        const seleccionContador = document.getElementById('seleccion-contador');
        const nombresFormatos = {
            gafete: 'Gafete',
            cartacom: 'Carta Compromiso',
            cartaimss: 'Carta Patronal IMSS',
            contrato: 'Contrato Laboral',
        };
        let empleadosCache = [];
        let statusFilter = 'TODOS';
        let searchQuery = '';
        let selectedRegistroIds = new Set();
        let selectedFormat = '';

        function clearFilters() {
            if (fechaDesdeInput) fechaDesdeInput.value = '';
            if (fechaHastaInput) fechaHastaInput.value = '';
            if (filterEstatus) filterEstatus.value = 'TODOS';
            if (buscador) buscador.value = '';
            statusFilter = 'TODOS';
            searchQuery = '';
            renderTabla();
        }

        function formatearFechaIngreso(valor) {
            const texto = String(valor || '').trim();
            const match = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) return `${match[3]}-${match[2]}-${match[1]}`;
            const slashMatch = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
            if (slashMatch) return `${slashMatch[1]}-${slashMatch[2]}-${slashMatch[3]}`;
            return texto || '-';
        }

        function getEmpleadoConLocal(emp) {
            const localByCurp = (window.DataManager && emp.curp) ? window.DataManager.getByCurp(emp.curp) : null;
            const localById = (window.DataManager && !localByCurp && emp.registro_id)
                ? window.DataManager.getEmpleados().find((it) => String(it.registro_id || '') === String(emp.registro_id || ''))
                : null;
            const local = localByCurp || localById || {};
            return {
                ...emp,
                ...local,
                nombre: local.nombre_completo || local.nombre || emp.nombre || '',
                nombre_completo: local.nombre_completo || local.nombre || emp.nombre || '',
                no_empleado: local.no_empleado || emp.no_empleado || '',
                fecha_ingreso: local.fecha_ingreso || local.fecha_registro || emp.fecha_ingreso || emp.fecha_registro || '',
                area: local.area || emp.area || '',
                turno: local.turno || emp.turno || '',
                estatus: String(emp.estatus || (local && local.estatus) || 'ACTIVO').toUpperCase(),
            };
        }

        function separarNombreApellidos(nombreCompleto) {
            const partes = String(nombreCompleto || '').trim().split(/\s+/).filter(Boolean);
            const apellidos = partes.splice(-2);
            return {
                nombre: partes.join(' '),
                apellidos: apellidos.join(' '),
            };
        }

        function matchesSearch(emp) {
            const displayEmp = getEmpleadoConLocal(emp);
            const text = `${displayEmp.nombre || ''} ${displayEmp.no_empleado || ''}`.toLowerCase();
            return text.includes(searchQuery);
        }

        function renderTabla() {
            const visibles = empleadosCache.map(getEmpleadoConLocal).filter((emp) => {
                const estatus = emp.estatus;
                if (statusFilter === 'ACTIVOS' && estatus !== 'ACTIVO') return false;
                if (statusFilter === 'INACTIVOS' && estatus !== 'INACTIVO') return false;
                return matchesSearch(emp);
            });

            if (!visibles.length) {
                cuerpo.innerHTML = `<tr><td colspan="${selectedFormat ? 8 : 7}" style="padding: 12px; text-align: center;">No hay empleados que coincidan con el filtro.</td></tr>`;
                actualizarSeleccionFormatos();
                return;
            }

            cuerpo.innerHTML = visibles.map(renderFila).join('');
            cuerpo.querySelectorAll('.seleccion-empleado').forEach((checkbox) => {
                checkbox.checked = selectedRegistroIds.has(checkbox.value);
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) selectedRegistroIds.add(checkbox.value);
                    else selectedRegistroIds.delete(checkbox.value);
                    actualizarSeleccionFormatos();
                });
            });
            actualizarSeleccionFormatos();
        }

        function actualizarSeleccionFormatos() {
            document.body.classList.toggle('modo-seleccion', Boolean(selectedFormat));
            seleccionFormatos.style.display = selectedFormat ? 'flex' : 'none';
            seleccionContador.textContent = selectedFormat
                ? nombresFormatos[selectedFormat]
                : 'Selecciona un documento automatizado';
        }

        function iniciarSeleccionFormato(formato) {
            selectedFormat = formato;
            selectedRegistroIds.clear();
            document.getElementById('menu-formatos-automatizados').open = false;
            renderTabla();
        }

        function cancelarSeleccionFormato() {
            selectedFormat = '';
            selectedRegistroIds.clear();
            renderTabla();
        }

        function getEstatusSincronizado(emp) {
            const localByCurp = (window.DataManager && emp.curp) ? window.DataManager.getByCurp(emp.curp) : null;
            const localById = (window.DataManager && !localByCurp && emp.registro_id)
                ? window.DataManager.getEmpleados().find((it) => String(it.registro_id || '') === String(emp.registro_id || ''))
                : null;
            const local = localByCurp || localById;
            return String((local && local.estatus) || emp.estatus || 'ACTIVO').toUpperCase();
        }

        async function getConFallback(endpoint) {
            let ultimoErrorRed = null;
            for (const baseUrl of API_BASES) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`);
                    const texto = await respuesta.text();
                    return { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }
            throw new Error(`No se pudo conectar con el servidor (${API_BASES.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        async function completarTurnosDesdeFicha(empleados) {
            await Promise.all(empleados.map(async (emp) => {
                if (String(emp.turno || '').trim() || !emp.registro_id) return;
                try {
                    const { respuesta, texto } = await getConFallback(`/obtener-empleado/${encodeURIComponent(emp.registro_id)}`);
                    if (!respuesta.ok) {
                        throw new Error(`Error ${respuesta.status}: ${texto || 'No se pudo consultar la ficha.'}`);
                    }
                    const datosEmpleado = JSON.parse(texto || '{}');
                    emp.turno = datosEmpleado.turno || '';
                } catch (error) {
                    console.error(`No se pudo cargar el turno del empleado ${emp.registro_id}:`, error);
                }
            }));
        }

        async function descargarExcelEmpleados(empresa) {
            for (const baseUrl of API_BASES) {
                try {
                    const respuesta = await fetch(`${baseUrl}/api/exportar-empleados/${encodeURIComponent(empresa)}?todos=1`);
                    if (!respuesta.ok) {
                        throw new Error(`Error ${respuesta.status}: ${await respuesta.text()}`);
                    }
                    const archivo = await respuesta.blob();
                    const url = URL.createObjectURL(archivo);
                    const enlace = document.createElement('a');
                    const fecha = new Date();
                    const fechaArchivo = `${fecha.getFullYear()}${String(fecha.getMonth() + 1).padStart(2, '0')}${String(fecha.getDate()).padStart(2, '0')}`;
                    enlace.href = url;
                    enlace.download = `listado_general_${empresa.toLowerCase()}_${fechaArchivo}.xlsx`;
                    enlace.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    return;
                } catch (error) {
                    if (error instanceof TypeError) continue;
                    alert(`No se pudo descargar el Excel: ${error.message}`);
                    return;
                }
            }
            alert('No se pudo conectar con el servidor para descargar el Excel.');
        }

        async function postConFallback(endpoint, body) {
            let ultimoErrorRed = null;
            for (const baseUrl of API_BASES) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body || {}),
                    });
                    const texto = await respuesta.text();
                    return { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }
            throw new Error(`No se pudo conectar con el servidor (${API_BASES.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        function renderFila(emp) {
            const displayEmp = getEmpleadoConLocal(emp);
            const { nombre, apellidos } = separarNombreApellidos(displayEmp.nombre);
            const estatus = displayEmp.estatus;
            const color = estatus === 'ACTIVO' ? '#28a745' : '#dc3545';
            const linkEmpleado = `empleado.html?registro_id=${encodeURIComponent(displayEmp.registro_id || '')}&nombre=${encodeURIComponent(displayEmp.nombre || '')}`;
            return `
                <tr>
                    <td class="seleccion-column" style="padding: 12px; text-align: center;"><input class="seleccion-empleado" type="checkbox" value="${String(displayEmp.registro_id || '')}" ${displayEmp.registro_id ? '' : 'disabled'} /></td>
                    <td style="padding: 12px; text-align: center;">${displayEmp.no_empleado || ''}</td>
                    <td style="padding: 12px;"><a class="btn-nombre" href="${linkEmpleado}">${nombre}</a></td>
                    <td style="padding: 12px;"><a class="btn-nombre" href="${linkEmpleado}">${apellidos}</a></td>
                    <td style="padding: 12px; text-align: center;">${formatearFechaIngreso(displayEmp.fecha_ingreso)}</td>
                    <td style="padding: 12px; text-align: center;">${displayEmp.area || ''}</td>
                    <td style="padding: 12px; text-align: center;">${displayEmp.turno || ''}</td>
                    <td style="padding: 12px; text-align: center;">
                        <button class="btn-estatus" data-registro-id="${String(displayEmp.registro_id || '').replace(/"/g, '&quot;')}" data-curp="${String(displayEmp.curp || '').replace(/"/g, '&quot;')}" data-nombre="${(displayEmp.nombre || '').replace(/"/g, '&quot;')}" style="background: ${color}; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; opacity: 1;">${estatus}</button>
                    </td>
                </tr>
            `;
        }

        function getSeleccionadosParaFormato() {
            const idsSeleccionados = new Set([...selectedRegistroIds].filter(Boolean));
            return empleadosCache
                .map(getEmpleadoConLocal)
                .filter((emp) => idsSeleccionados.has(String(emp.registro_id || '')));
        }

        async function generarFormatoSeleccionado() {
            const seleccionados = getSeleccionadosParaFormato();
            if (!seleccionados.length) {
                alert('Selecciona al menos un empleado para generar el formato.');
                return;
            }

            try {
                if (selectedFormat === 'gafete') {
                    const datosParaGafetes = await Promise.all(seleccionados.map(async (emp) => {
                        const { respuesta, texto } = await getConFallback(`/obtener-empleado/${encodeURIComponent(emp.registro_id)}`);
                        if (!respuesta.ok) {
                            throw new Error(`No se pudo cargar el empleado ${emp.no_empleado || emp.registro_id}: ${texto || respuesta.status}`);
                        }
                        return { ...emp, ...JSON.parse(texto || '{}') };
                    }));
                    const returnUrl = 'Kronos.html';
                    localStorage.setItem('gafeteBatchData', JSON.stringify(datosParaGafetes));
                    localStorage.setItem('gafeteReturnUrl', returnUrl);
                    window.location.href = 'maingafette.html?batch=1&return_url=Kronos.html';
                    return;
                }

                const params = new URLSearchParams({
                    tipo: selectedFormat,
                    ids: seleccionados.map((emp) => emp.registro_id).join(','),
                    return_url: 'Kronos.html',
                });
                window.location.href = `formatos-lote.html?${params.toString()}`;
            } catch (error) {
                alert(`No se pudo generar el formato: ${error.message}`);
            }
        }

        async function cargarEmpleadosKronos() {
            cuerpo.innerHTML = `<tr><td colspan="${selectedFormat ? 8 : 7}" style="padding: 12px; text-align: center;">Cargando empleados...</td></tr>`;

            try {
                const { respuesta, texto } = await getConFallback('/api/obtener-empleados/KRONOS');
                if (!respuesta.ok) {
                    cuerpo.innerHTML = `<tr><td colspan="${selectedFormat ? 8 : 7}" style="padding: 12px; text-align: center;">No se pudieron cargar empleados.</td></tr>`;
                    alert(`Error al cargar empleados (${respuesta.status}): ${texto || 'Sin detalle'}`);
                    return;
                }

                const empleados = JSON.parse(texto || '[]');
                await completarTurnosDesdeFicha(empleados);
                empleadosCache = window.DataManager && typeof window.DataManager.deduplicate === 'function'
                    ? window.DataManager.deduplicate(empleados)
                    : (Array.isArray(empleados) ? empleados : []);
                if (window.DataManager && Array.isArray(empleadosCache)) {
                    window.DataManager.upsertMany(empleadosCache.map((emp) => ({
                        registro_id: emp.registro_id,
                        curp: emp.curp || '',
                        nombre: emp.nombre || '',
                        nombre_completo: emp.nombre || '',
                        empresa: 'KRONOS',
                        puesto: emp.puesto || '',
                        area: emp.area || '',
                        turno: emp.turno || '',
                        estatus: emp.estatus || 'ACTIVO',
                        fecha_ingreso: emp.fecha_ingreso || '',
                    })));
                }

                renderTabla();
            } catch (error) {
                cuerpo.innerHTML = `<tr><td colspan="${selectedFormat ? 8 : 7}" style="padding: 12px; text-align: center;">No se pudieron cargar empleados.</td></tr>`;
                alert('Error de conexión al cargar empleados: ' + error.message);
            }
        }

        async function toggleEstatus(btn) {
            const current = (btn.innerText || '').trim().toUpperCase();
            const nuevo = current === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO';
            const identidad = {
                curp: btn.dataset.curp || '',
                registro_id: btn.dataset.registroId || '',
                nombre: btn.dataset.nombre || '',
            };

            const registroId = String(btn.dataset.registroId || '').trim();
            if (!registroId) {
                alert('No se pudo identificar el empleado para actualizar estatus.');
                return;
            }

            btn.disabled = true;
            try {
                const { respuesta, texto } = await postConFallback(`/api/actualizar-empleado/${encodeURIComponent(registroId)}`, {
                    estatus: nuevo,
                });

                if (!respuesta.ok) {
                    throw new Error(texto || 'No se pudo actualizar el estatus.');
                }

                if (window.DataManager) {
                    window.DataManager.updateEmpleadoByIdentity(identidad, { estatus: nuevo });
                    window.actualizarVistas && window.actualizarVistas();
                }

                await cargarEmpleadosKronos();
            } catch (error) {
                alert('Error al actualizar estatus: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        filterEstatus.addEventListener('change', () => {
            statusFilter = filterEstatus.value || 'TODOS';
            renderTabla();
        });

        buscador.addEventListener('keyup', function() {
            searchQuery = String(this.value || '').trim().toLowerCase();
            renderTabla();
        });

        if (btnLimpiarFiltros) {
            btnLimpiarFiltros.addEventListener('click', clearFilters);
        }

        if (btnDescargarExcel) {
            btnDescargarExcel.addEventListener('click', () => descargarExcelEmpleados('KRONOS'));
        }

        document.querySelectorAll('[data-formato]').forEach((button) => {
            button.addEventListener('click', () => iniciarSeleccionFormato(button.dataset.formato));
        });
        document.getElementById('btn-generar-formato').addEventListener('click', generarFormatoSeleccionado);
        document.getElementById('btn-cancelar-formato').addEventListener('click', cancelarSeleccionFormato);

        cuerpo.addEventListener('click', (event) => {
            const btn = event.target.closest('.btn-estatus');
            if (!btn) return;
            toggleEstatus(btn);
        });

        document.addEventListener('DOMContentLoaded', () => {
            cargarEmpleadosKronos();
            if (window.DataManager) {
                window.DataManager.subscribeVistas(cargarEmpleadosKronos);
            }
        });
    </script>

</body>
</html>
