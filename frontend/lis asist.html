<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal CWM</title>
    <!-- Importar Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #000000; }
        .form-container { background: #2c2c2c; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }
        input, select { background: #3e3e3e; border: 1px solid #555; color: #fff; padding: 12px; width: 100%; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #ffffff;
            border-bottom: 2px solid #444;
        }

        .branding { display: flex; align-items: center; gap: -5px; }
        .logo { 
            width: 100px;
            height: 40px;
            border-radius: 5px;
            object-fit: contain;
        }
        
/* FONDO */
        main {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://lh3.googleusercontent.com/d/1eE6EhkUOssI4urpPpSTUVKjx859AvtkO');
            background-size: cover;
            background-position: center;
            min-height: calc(100vh - 63px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

/* LOGIN*/
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 60px;
            background-color: rgba(20, 20, 20, 0.75);          
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .login-container h2 {
            color: #ffffff;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* ÍCONO */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
        }

        .login-container input { 
            width: 100%; 
            padding: 14px 14px 14px 45px; /* Espacio a la izquierda para el ícono */
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box; 
            color: #ffffff;
            font-size: 0.95rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        .login-container input::placeholder {
            color: #9ca3af;
        }

        .login-container input:focus {
            border-color: #3b82f6;
            background: rgba(40, 40, 40, 0.9);
        }

        /* BOTÓN */
        .login-container button { 
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #1d4ed8;
            padding: 10px 12px;
            border-radius: 5px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .login-container button:hover {
            background: #1d4ed8; color: #fff;
        }

        .login-container button:active {
            transform: scale(0.98);
        }

        /* ÍCONOS GENERALES */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
        }

        /* ÍCONO DEL OJO */
        .input-group i.toggle-password {
            position: absolute;
            left: auto;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
        }

        h2{
            color: #ffffff;
            font-size: 2rem;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            font-weight: 600;
            font-family: Century Gothic, sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0; font-weight: 700;">CHEONG WOON MEXICO</h1>
        </div>
    </header>

    <main>
        <div id="loginSection" class="login-container">
            <h2>CONTROL DE ASISTENCIAS</h2>
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="user" placeholder="Usuario" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="pass" placeholder="Contraseña" required>
                    <i class="far fa-eye-slash toggle-password" onclick="togglePasswordVisibility(this)"></i>
                </div>

                <button type="submit">INGRESAR</button>
            </form>

            <div id="mensajeError" style="color: #ff4d4d; margin-top: 15px; font-size: 0.9rem; display: none; text-align: center;">
                ⚠️ Usuario o contraseña incorrectos
            </div>
        </div>
    </main>
    <script>
        function togglePasswordVisibility(iconElement) {
            const passwordBox = iconElement.previousElementSibling;
            if (passwordBox.getAttribute('type') === 'password') {
                passwordBox.setAttribute('type', 'text');
                iconElement.classList.remove('fa-eye-slash');
                iconElement.classList.add('fa-eye');
            } else {
                passwordBox.setAttribute('type', 'password');
                iconElement.classList.remove('fa-eye');
                iconElement.classList.add('fa-eye-slash');
            }
        }
    </script>

</body>
</html>
