<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #fff; 
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

        .branding { display: flex; align-items: center; gap: -5px; }
        .logo { 
            width: 100px;
            height: 40px;
            border-radius: 5px;
            object-fit: contain;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }

        @keyframes neon-glow {
            0% { box-shadow: 0 0 15px #ff4b4b, 0 0 30px #ff4b4b; }
            50% { box-shadow: 0 0 15px #1c7ed6, 0 0 30px #1c7ed6; }
            100% { box-shadow: 0 0 15px #ff4b4b, 0 0 30px #ff4b4b; }
        }

        .login-container {
            width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: #2c2c2c; /* Fondo de la tarjeta oscuro */
            border-radius: 15px;
            animation: neon-glow 10s infinite alternate;
            text-align: center;
            border: 1px solid #444;
        }

        .login-container input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #3e3e3e; border: 1px solid #555; border-radius: 5px; 
            box-sizing: border-box; color: white;
        }

        .login-container button { 
            width: 100%; padding: 12px; background: #007bff; 
            color: white; border: none; border-radius: 5px; 
            cursor: pointer; font-weight: bold; margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CHEONG WOON MEXICO</h1>
        </div>

        <nav class="nav-links">
            <a href="main.html">Principal</a>
            <a href="portalrh.html" class="active">Login</a>
        </nav>
    </header>

    <main>
        <div id="loginSection" class="login-container">
            <span style='font-size: 60px;'>웃</span>
            <h2 style="margin-top: 0; color: #fff;">CW CONNECT</h2>

            <form id="loginForm" autocomplete="off">
                <input type="text" id="user" placeholder="Usuario" required>
                <input type="password" id="pass" placeholder="Contraseña" required>

                <button type="submit">Ingresar</button>
            </form>

            <div id="mensajeError" style="color: #ff4d4d; margin-top: 15px; font-size: 0.9rem; display: none; text-align: center;">
                ⚠️ Usuario o contraseña incorrectos
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        function verificarAcceso() {
            const u = String(document.getElementById('user').value || '').trim();
            const p = String(document.getElementById('pass').value || '').trim();
            const errorMsg = document.getElementById('mensajeError');

            const loginConfig = window.LOGIN_CONFIG || {};
            const rhConfig = loginConfig.rh || {};
            const reclutamientoConfig = loginConfig.reclutamiento || {};

            if ((u === rhConfig.username || u.toUpperCase() === 'ADMIN') && p === rhConfig.password) {
                window.location.href = rhConfig.redirect || 'iniciorh.html';
                return;
            }

            if (u === reclutamientoConfig.username && p === reclutamientoConfig.password) {
                window.location.href = reclutamientoConfig.redirect || 'InicioReclu.html';
                return;
            }

            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 3000);
        }

        (function configurarLogin() {
            const user = document.getElementById('user');
            const pass = document.getElementById('pass');
            const form = document.getElementById('loginForm');

            function intentarIngresarConEnter(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    verificarAcceso();
                }
            }

            if (user) user.addEventListener('keydown', intentarIngresarConEnter);
            if (pass) pass.addEventListener('keydown', intentarIngresarConEnter);
            if (form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    verificarAcceso();
                });
            }
        })();
    </script>

</body>
</html>
