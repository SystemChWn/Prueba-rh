<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Personal: Cheong Woon</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
/* Eliminar la barra de desplazamiento visualmente */
        ::-webkit-scrollbar {display: none;}
        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 2px solid #444; }
        .branding { display: flex; align-items: center; gap: 10px; }
        .logo { width: 100px; height: 40px; border-radius: 5px; object-fit: contain; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #ddd; font-weight: bold; padding: 5px 10px; }
        .nav-links a.active { color: #007bff; border-bottom: 2px solid #007bff; }
/* SECCIONES DE ENCABEZADO */
        .main-header {
            display: flex;
            justify-content: space-between; /* Distribuye el espacio */
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #444;
        }

/* CENTRAR MENU DE OPCIONES */
        .header-section {
            flex: 1; 
            display: flex;
            align-items: center;
        }

        .left { justify-content: flex-start; }  /* Logo a la izquierda */
        .center { justify-content: center; }    /* Menú al centro */
        .right { justify-content: flex-end; }   /* Botón a la derecha */

/* SEPARACION DE MENU DE OPCIONES */
        .nav-links {
            gap: 40px; 
        }

/* Botón Cerrar Sesión */
        .btn-logout {
            text-decoration: none;
            color: #ff4b4b;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #ff4b4b;
            padding: 5px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4b4b; color: white; }

/* FILTROS*/
        .filtros-container { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .filtro-input { background: #121212; border: 1px solid #444; color: #fff; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; transition: all 0.3s ease; outline: none; }
        .filtro-input:focus { border-color: #007bff; box-shadow: 0 0 8px rgba(0,123,255,0.3); }
        .filtro-label { font-size: 0.85rem; margin-right: 8px; font-weight: bold; }
        .btn-nombre { color: #ffffff; text-decoration: none; font-weight: 600; cursor: pointer; }
        .btn-nombre:hover { text-decoration: underline; }

        .btn-descargar-gafette { 
            background: #2c2c2c; 
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #007bff;
            padding: 5px 12px;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-descargar-gafette:hover { background: #007bff; color: white; }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CW CONNECT</h1>
        </div>
        <nav class="nav-links">
            <a href="iniciorh.html">Inicio</a>
            <a href="Ingreso.html">Ingresos</a>
            <a href="Cheong Woon.html" class="active">Cheong Woon</a>
            <a href="Kronos.html">Kronos</a>
            <a href="asistencia.html">Asistencia</a>
        </nav>
        <div class="header-right">
            <a href="portalrh.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>
    <main style="padding: 20px;">
        <div class="filtros-container">
            <div>
                <span class="filtro-label">DE:</span>
                <input type="date" id="filtro-fecha-desde" class="filtro-input">
                <span class="filtro-label" style="margin-left: 15px;">A:</span>
                <input type="date" id="filtro-fecha-hasta" class="filtro-input">
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="filtro-label">Estatus:</span>
                <select id="filter-estatus" class="filtro-input" style="width: 180px; cursor: pointer;">
                    <option value="TODOS">Todos</option>
                    <option value="ACTIVOS">Activos</option>
                    <option value="INACTIVOS">Inactivos</option>
                </select>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="text" id="buscador" class="filtro-input" placeholder="🔍 Buscar por nombre o # empleado..." style="width: 350px;">
                <button id="btn-limpiar-filtros" type="button" class="filtro-input" style="width: auto; cursor: pointer;">Limpiar filtros</button>
            </div>
        </div>
        
        <table style="width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px;">
            <thead>
                <tr style="border-bottom: 2px solid #444;">
                    <th style="padding: 12px; text-align: left;">Nombre Completo</th>
                    <th style="padding: 12px; min-width: 180px; text-align: center;">
                        <button id="btn-descargar-gafette" class= "btn-descargar-gafette" >Descargar gafette</button>
                    </th>
                    <th style="padding: 12px;">No. Empleado</th>
                    <th style="padding: 12px;">Fecha Ingreso</th>
                    <th style="padding: 12px;">Estatus</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla-empleados">
                <tr>
                    <td colspan="6" style="padding: 12px; text-align: center;">Cargando empleados...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="data-manager.js"></script>
    <script>
        const currentHost = window.location.hostname;
        const PORT = '8001';
        const API_URL = `http://${currentHost}:${PORT}`;
        const API_BASES = [API_URL, `http://localhost:${PORT}`];

        const cuerpo = document.getElementById('cuerpo-tabla-empleados');
        const buscador = document.getElementById('buscador');
        const filterEstatus = document.getElementById('filter-estatus');
        const fechaDesdeInput = document.getElementById('filtro-fecha-desde');
        const fechaHastaInput = document.getElementById('filtro-fecha-hasta');
        const btnLimpiarFiltros = document.getElementById('btn-limpiar-filtros');
        let empleadosCache = [];
        let statusFilter = 'TODOS';
        let searchQuery = '';
        let selectedRegistroIds = new Set();
        const FILTER_STATE_KEY = 'cheongWoonFiltersState';

        function parseFechaValor(valor) {
            if (!valor) return null;
            const texto = String(valor).trim();
            if (!texto) return null;

            const fechaDirecta = new Date(texto);
            if (!Number.isNaN(fechaDirecta.getTime())) {
                const fecha = new Date(fechaDirecta);
                fecha.setHours(0, 0, 0, 0);
                return fecha;
            }

            const variosFormatos = [
                /^(\d{4})-(\d{2})-(\d{2})$/,
                /^(\d{2})\/(\d{2})\/(\d{4})$/,
                /^(\d{4})\/(\d{2})\/(\d{2})$/,
            ];

            for (const patron of variosFormatos) {
                const match = texto.match(patron);
                if (match) {
                    const [, a, b, c] = match;
                    const dia = Number(a.length === 4 ? c : a);
                    const mes = Number(a.length === 4 ? b : b);
                    const anio = Number(a.length === 4 ? a : c);
                    const fecha = new Date(anio, mes - 1, dia);
                    if (!Number.isNaN(fecha.getTime())) {
                        fecha.setHours(0, 0, 0, 0);
                        return fecha;
                    }
                }
            }

            return null;
        }

        function matchesDateRange(emp) {
            const fechaDesde = fechaDesdeInput ? parseFechaValor(fechaDesdeInput.value) : null;
            const fechaHasta = fechaHastaInput ? parseFechaValor(fechaHastaInput.value) : null;
            const fechaIngreso = parseFechaValor(emp.fecha_ingreso || emp.fecha_registro || '');

            if (fechaDesde && (!fechaIngreso || fechaIngreso < fechaDesde)) return false;
            if (fechaHasta && (!fechaIngreso || fechaIngreso > fechaHasta)) return false;
            return true;
        }

        function saveFilterState() {
            const state = {
                fechaDesde: fechaDesdeInput ? fechaDesdeInput.value : '',
                fechaHasta: fechaHastaInput ? fechaHastaInput.value : '',
                estatus: filterEstatus ? filterEstatus.value : 'TODOS',
                search: buscador ? buscador.value : '',
                selectedIds: Array.from(selectedRegistroIds).filter(Boolean),
            };
            sessionStorage.setItem(FILTER_STATE_KEY, JSON.stringify(state));
        }

        function restoreFilterState() {
            try {
                const raw = sessionStorage.getItem(FILTER_STATE_KEY);
                if (!raw) return;
                const state = JSON.parse(raw);
                if (fechaDesdeInput) fechaDesdeInput.value = state.fechaDesde || '';
                if (fechaHastaInput) fechaHastaInput.value = state.fechaHasta || '';
                if (filterEstatus) filterEstatus.value = state.estatus || 'TODOS';
                if (buscador) buscador.value = state.search || '';
                statusFilter = String(state.estatus || 'TODOS').toUpperCase();
                searchQuery = String(state.search || '').trim().toLowerCase();
                selectedRegistroIds = new Set((state.selectedIds || []).filter(Boolean));
            } catch (_) {}
        }

        function clearFilters() {
            if (fechaDesdeInput) fechaDesdeInput.value = '';
            if (fechaHastaInput) fechaHastaInput.value = '';
            if (filterEstatus) filterEstatus.value = 'TODOS';
            if (buscador) buscador.value = '';
            statusFilter = 'TODOS';
            searchQuery = '';
            selectedRegistroIds.clear();
            saveFilterState();
            renderTabla();
        }

        function getEmpleadoConLocal(emp) {
            const localByCurp = (window.DataManager && emp.curp) ? window.DataManager.getByCurp(emp.curp) : null;
            const localById = (window.DataManager && !localByCurp && emp.registro_id)
                ? window.DataManager.getEmpleados().find((it) => String(it.registro_id || '') === String(emp.registro_id || ''))
                : null;
            const local = localByCurp || localById || {};
            return {
                ...emp,
                ...local,
                nombre: local.nombre_completo || local.nombre || emp.nombre || '',
                nombre_completo: local.nombre_completo || local.nombre || emp.nombre || '',
                no_empleado: local.no_empleado || emp.no_empleado || '',
                fecha_ingreso: local.fecha_ingreso || local.fecha_registro || emp.fecha_ingreso || emp.fecha_registro || '',
                estatus: String(emp.estatus || (local && local.estatus) || 'ACTIVO').toUpperCase(),
            };
        }

        function matchesSearch(emp) {
            const displayEmp = getEmpleadoConLocal(emp);
            const text = `${displayEmp.nombre || ''} ${displayEmp.no_empleado || ''}`.toLowerCase();
            return text.includes(searchQuery);
        }

        function renderTabla() {
            const visibles = empleadosCache.map(getEmpleadoConLocal).filter((emp) => {
                const estatus = emp.estatus;
                if (statusFilter === 'ACTIVOS' && estatus !== 'ACTIVO') return false;
                if (statusFilter === 'INACTIVOS' && estatus !== 'INACTIVO') return false;
                if (!matchesDateRange(emp)) return false;
                return matchesSearch(emp);
            });

            if (!visibles.length) {
                cuerpo.innerHTML = '<tr><td colspan="5" style="padding: 12px; text-align: center;">No hay empleados que coincidan con el filtro.</td></tr>';
                return;
            }

            cuerpo.innerHTML = visibles.map(renderFila).join('');

            document.querySelectorAll('.seleccion-gafete').forEach((checkbox) => {
                checkbox.checked = selectedRegistroIds.has(checkbox.value);
                checkbox.addEventListener('change', () => {
                    const id = checkbox.value;
                    if (checkbox.checked) {
                        selectedRegistroIds.add(id);
                    } else {
                        selectedRegistroIds.delete(id);
                    }
                    saveFilterState();
                });
            });

            saveFilterState();
        }

        function getEstatusSincronizado(emp) {
            const localByCurp = (window.DataManager && emp.curp) ? window.DataManager.getByCurp(emp.curp) : null;
            const localById = (window.DataManager && !localByCurp && emp.registro_id)
                ? window.DataManager.getEmpleados().find((it) => String(it.registro_id || '') === String(emp.registro_id || ''))
                : null;
            const local = localByCurp || localById;
            return String((local && local.estatus) || emp.estatus || 'ACTIVO').toUpperCase();
        }

        async function getConFallback(endpoint) {
            let ultimoErrorRed = null;
            for (const baseUrl of API_BASES) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`);
                    const texto = await respuesta.text();
                    return { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }
            throw new Error(`No se pudo conectar con el servidor (${API_BASES.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        async function postConFallback(endpoint, body) {
            let ultimoErrorRed = null;
            for (const baseUrl of API_BASES) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body || {}),
                    });
                    const texto = await respuesta.text();
                    return { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }
            throw new Error(`No se pudo conectar con el servidor (${API_BASES.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        function renderFila(emp) {
            const displayEmp = getEmpleadoConLocal(emp);
            const estatus = displayEmp.estatus;
            const color = estatus === 'ACTIVO' ? '#28a745' : '#dc3545';
            const linkEmpleado = `empleado.html?registro_id=${encodeURIComponent(displayEmp.registro_id || '')}&nombre=${encodeURIComponent(displayEmp.nombre || '')}`;
            const registroId = String(displayEmp.registro_id || '');
            return `
                <tr>
                    <td style="padding: 12px;"><a class="btn-nombre" href="${linkEmpleado}">${displayEmp.nombre || ''}</a></td>
                    <td style="padding: 12px; text-align: center;"><input class="seleccion-gafete" type="checkbox" value="${registroId}" /></td>
                    <td style="padding: 12px; text-align: center;">${displayEmp.no_empleado || ''}</td>
                    <td style="padding: 12px; text-align: center;">${displayEmp.fecha_ingreso || '-'}</td>
                    <td style="padding: 12px; text-align: center;">
                        <button class="btn-estatus" data-registro-id="${String(displayEmp.registro_id || '').replace(/"/g, '&quot;')}" data-curp="${String(displayEmp.curp || '').replace(/"/g, '&quot;')}" data-nombre="${(displayEmp.nombre || '').replace(/"/g, '&quot;')}" style="background: ${color}; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; opacity: 1;">${estatus}</button>
                    </td>
                </tr>
            `;
        }

        function getSeleccionadosParaGafete() {
            const idsSeleccionados = new Set([...selectedRegistroIds].filter(Boolean));
            return empleadosCache
                .map(getEmpleadoConLocal)
                .filter((emp) => idsSeleccionados.has(String(emp.registro_id || '')));
        }

        async function descargarGafette() {
            const seleccionados = getSeleccionadosParaGafete();
            if (!seleccionados.length) {
                alert('Selecciona al menos una persona para generar gafetes.');
                return;
            }

            const datosParaGafetes = [];
            for (const emp of seleccionados) {
                const registroId = String(emp.registro_id || '').trim();
                let datosEmpleado = {
                    nombre_completo: emp.nombre_completo || emp.nombre || '',
                    nss: emp.nss || emp.imss || '',
                    curp: emp.curp || '',
                    area: emp.area || emp.puesto || '',
                    nombre_emergencia: emp.nombre_emergencia || '',
                    telefono_emergencia: emp.telefono_emergencia || emp.num_emergencias || '',
                    fecha_ingreso: emp.fecha_ingreso || '',
                    fotografia_base64: emp.fotografia_base64 || '',
                    no_empleado: emp.no_empleado || '',
                };

                if (registroId) {
                    try {
                        const { respuesta, texto } = await getConFallback(`/api/obtener-empleado/${encodeURIComponent(registroId)}`);
                        if (respuesta.ok) {
                            const datosDetallados = JSON.parse(texto || '{}');
                            datosEmpleado = {
                                ...datosEmpleado,
                                ...datosDetallados,
                                nombre_completo: datosDetallados.nombre_completo || datosDetallados.nombre || datosEmpleado.nombre_completo,
                                nss: datosDetallados.nss || datosDetallados.imss || datosEmpleado.nss,
                                curp: datosDetallados.curp || datosEmpleado.curp,
                                area: datosDetallados.area || datosDetallados.puesto || datosEmpleado.area,
                                nombre_emergencia: datosDetallados.nombre_emergencia || datosEmpleado.nombre_emergencia,
                                telefono_emergencia: datosDetallados.telefono_emergencia || datosDetallados.num_emergencias || datosEmpleado.telefono_emergencia,
                                fecha_ingreso: datosDetallados.fecha_ingreso || datosEmpleado.fecha_ingreso,
                                fotografia_base64: datosDetallados.fotografia_base64 || datosEmpleado.fotografia_base64,
                            };
                        }
                    } catch (_) {}
                }

                datosParaGafetes.push(datosEmpleado);
            }

            localStorage.setItem('gafeteBatchData', JSON.stringify(datosParaGafetes));
            localStorage.setItem('gafeteReturnUrl', 'Cheong Woon.html');
            window.location.href = 'maingafette.html?batch=1&return_url=Cheong%20Woon.html';
        }

        async function cargarEmpleadosCheongWoon() {
            cuerpo.innerHTML = '<tr><td colspan="6" style="padding: 12px; text-align: center;">Cargando empleados...</td></tr>';

            try {
                const { respuesta, texto } = await getConFallback('/api/obtener-empleados/CHEONG_WOON');
                if (!respuesta.ok) {
                    cuerpo.innerHTML = '<tr><td colspan="4" style="padding: 12px; text-align: center;">No se pudieron cargar empleados.</td></tr>';
                    alert(`Error al cargar empleados (${respuesta.status}): ${texto || 'Sin detalle'}`);
                    return;
                }

                const empleados = JSON.parse(texto || '[]');
                empleadosCache = Array.isArray(empleados) ? empleados : [];
                if (window.DataManager && Array.isArray(empleadosCache)) {
                    window.DataManager.upsertMany(empleadosCache.map((emp) => ({
                        registro_id: emp.registro_id,
                        curp: emp.curp || '',
                        nombre: emp.nombre || '',
                        nombre_completo: emp.nombre || '',
                        empresa: 'CHEONG WOON',
                        puesto: emp.puesto || '',
                        estatus: emp.estatus || 'ACTIVO',
                        fecha_ingreso: emp.fecha_ingreso || '',
                    })));
                }

                renderTabla();
            } catch (error) {
                cuerpo.innerHTML = '<tr><td colspan="4" style="padding: 12px; text-align: center;">No se pudieron cargar empleados.</td></tr>';
                alert('Error de conexión al cargar empleados: ' + error.message);
            }
        }

        async function toggleEstatus(btn) {
            const current = (btn.innerText || '').trim().toUpperCase();
            const nuevo = current === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO';
            const identidad = {
                curp: btn.dataset.curp || '',
                registro_id: btn.dataset.registroId || '',
                nombre: btn.dataset.nombre || '',
            };

            const registroId = String(btn.dataset.registroId || '').trim();
            if (!registroId) {
                alert('No se pudo identificar el empleado para actualizar estatus.');
                return;
            }

            btn.disabled = true;
            try {
                const { respuesta, texto } = await postConFallback(`/api/actualizar-empleado/${encodeURIComponent(registroId)}`, {
                    estatus: nuevo,
                });

                if (!respuesta.ok) {
                    throw new Error(texto || 'No se pudo actualizar el estatus.');
                }

                if (window.DataManager) {
                    window.DataManager.updateEmpleadoByIdentity(identidad, { estatus: nuevo });
                    window.actualizarVistas && window.actualizarVistas();
                }

                await cargarEmpleadosCheongWoon();
            } catch (error) {
                alert('Error al actualizar estatus: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        function actualizarFiltrosDesdeUI() {
            statusFilter = (filterEstatus ? filterEstatus.value : 'TODOS') || 'TODOS';
            searchQuery = String(buscador ? buscador.value : '').trim().toLowerCase();
            renderTabla();
        }

        if (filterEstatus) {
            filterEstatus.addEventListener('change', () => {
                actualizarFiltrosDesdeUI();
                saveFilterState();
            });
        }

        if (buscador) {
            buscador.addEventListener('input', function() {
                actualizarFiltrosDesdeUI();
                saveFilterState();
            });
        }

        if (fechaDesdeInput) {
            fechaDesdeInput.addEventListener('change', () => {
                renderTabla();
                saveFilterState();
            });
        }

        if (fechaHastaInput) {
            fechaHastaInput.addEventListener('change', () => {
                renderTabla();
                saveFilterState();
            });
        }

        if (btnLimpiarFiltros) {
            btnLimpiarFiltros.addEventListener('click', clearFilters);
        }

        cuerpo.addEventListener('click', (event) => {
            const btn = event.target.closest('.btn-estatus');
            if (!btn) return;
            toggleEstatus(btn);
        });

        document.addEventListener('DOMContentLoaded', () => {
            restoreFilterState();

            const btnDescargarGafette = document.getElementById('btn-descargar-gafette');
            if (btnDescargarGafette) {
                btnDescargarGafette.addEventListener('click', descargarGafette);
            }

            cargarEmpleadosCheongWoon();
            if (window.DataManager) {
                window.DataManager.subscribeVistas(cargarEmpleadosCheongWoon);
            }
        });
    </script>

</body>
</html>
