<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Personal: CWM</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        ::-webkit-scrollbar{ display:none }
        body{ margin:0;font-family:Arial,helvetica,sans-serif;background:#121212;color:#fff }
        header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#1e1e1e;border-bottom:2px solid #444}
        .branding{display:flex;align-items:center;gap:10px}
        .main-header{display:flex;gap:12px;align-items:center;padding:12px}
        .filtro-input{padding:6px;border-radius:6px;border:1px solid #333;background:#0f172a;color:#fff}
        table{width:100%;border-collapse:collapse;background:#1e1e1e;border-radius:8px}
        th,td{padding:12px;border-bottom:1px solid #2a2a2a}
        .btn-nombre{background:#2563eb;color:#fff;border:none;padding:8px 10px;border-radius:6px;cursor:pointer}
    </style>
</head>
<body>
<header>
    <div class="branding">
        <img class="logo" src="/logo.png" alt="logo" style="width:120px;height:40px;object-fit:contain">
        <h1 style="font-size:18px;margin:0">Cheong Woon - Personal</h1>
    </div>
    <div>
        <button id="btn-descargar-gafettes" class="btn-nombre">Descargar Gafettes</button>
    </div>
</header>
<main style="padding:18px">
    <div class="main-header">
        <div>
            <label class="filtro-label">DE: <input id="fecha-desde" class="filtro-input" type="date"></label>
            <label class="filtro-label" style="margin-left:12px">A: <input id="fecha-hasta" class="filtro-input" type="date"></label>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
            <label>Estatus: <select id="filter-estatus" class="filtro-input"><option value="TODOS">Todos</option><option value="ACTIVOS">Activos</option><option value="INACTIVOS">Inactivos</option></select></label>
            <input id="buscador" class="filtro-input" placeholder="🔍 Buscar empleado..." style="width:300px">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width:48px"></th>
                <th>Nombre Completo</th>
                <th>No. Empleado</th>
                <th>Fecha Ingreso</th>
                <th>Estatus</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla-empleados">
            <tr><td colspan="5" style="text-align:center;padding:18px">Cargando empleados...</td></tr>
        </tbody>
    </table>
</main>

<script src="data-manager.js"></script>
<script>
// Minimal, self-contained page script using DataManager when available
let empleadosCache = [];
const cuerpo = document.getElementById('cuerpo-tabla-empleados');
const filterEstatus = document.getElementById('filter-estatus');
const buscador = document.getElementById('buscador');
const btnDescargarGafettes = document.getElementById('btn-descargar-gafettes');
let statusFilter = 'TODOS';
let searchQuery = '';

function getEmpleadoConLocal(emp){
    return emp || {};
}

function renderFila(emp){
    const display = getEmpleadoConLocal(emp);
    const color = (display.estatus || '').toUpperCase() === 'ACTIVO' ? '#10b981' : '#ef4444';
    return `
    <tr>
        <td style="text-align:center"><input type="checkbox" class="checkbox-gafete" data-registro-id="${String(display.registro_id || '')}" data-nombre="${(display.nombre || '').replace(/"/g,'&quot;')}" data-no-empleado="${String(display.registro_id||'')}"></td>
        <td>${(display.nombre_completo || display.nombre || '')}</td>
        <td style="text-align:center">${display.registro_id || ''}</td>
        <td style="text-align:center">${display.fecha_ingreso || '-'}</td>
        <td style="text-align:center"><button class="btn-estatus" data-registro-id="${String(display.registro_id||'')}" data-curp="${String(display.curp||'')}" data-nombre="${(display.nombre||'').replace(/"/g,'&quot;')}" style="background:${color};color:#fff;border:none;padding:6px 8px;border-radius:6px">${(display.estatus||'').toUpperCase()}</button></td>
    </tr>`;
}

function matchesSearch(emp){
    const t = ((emp.nombre || '') + ' ' + (emp.registro_id || '')).toLowerCase();
    return t.includes(searchQuery);
}

function renderTabla(){
    const visibles = empleadosCache.filter(e => {
        if (statusFilter === 'ACTIVOS' && (e.estatus||'').toUpperCase()!=='ACTIVO') return false;
        if (statusFilter === 'INACTIVOS' && (e.estatus||'').toUpperCase()!=='INACTIVO') return false;
        return matchesSearch(e);
    });
    if (!visibles.length){
        cuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:18px">No hay empleados que coincidan con el filtro.</td></tr>';
        return;
    }
    cuerpo.innerHTML = visibles.map(renderFila).join('');
}

async function cargarEmpleadosCheongWoon(){
    cuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:18px">Cargando empleados...</td></tr>';
    try{
        const res = await fetch('/api/obtener-empleados/CHEONG_WOON');
        const txt = await res.text();
        if (!res.ok) throw new Error(txt || res.statusText);
        const datos = JSON.parse(txt||'[]');
        empleadosCache = Array.isArray(datos)?datos:[];
        if (window.DataManager && Array.isArray(empleadosCache)){
            window.DataManager.upsertMany(empleadosCache.map(emp=>({
                registro_id: emp.registro_id,
                curp: emp.curp||'', nombre: emp.nombre||'', nombre_completo: emp.nombre||'', empresa:'CHEONG WOON', puesto: emp.puesto||'', estatus: emp.estatus||'ACTIVO', fecha_ingreso: emp.fecha_ingreso||''
            })));
        }
        renderTabla();
    }catch(err){
        cuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:18px">No se pudieron cargar empleados.</td></tr>';
        console.error(err);
        alert('Error al cargar empleados: '+err.message);
    }
}

async function toggleEstatus(btn){
    const registroId = String(btn.dataset.registroId||'').trim();
    if(!registroId){ alert('Registro no identificado'); return; }
    const nuevo = ((btn.innerText||'').trim().toUpperCase()==='ACTIVO')? 'INACTIVO':'ACTIVO';
    btn.disabled = true;
    try{
        const res = await fetch(`/api/actualizar-empleado/${encodeURIComponent(registroId)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({estatus:nuevo})});
        if(!res.ok) throw new Error(await res.text());
        if(window.DataManager) window.DataManager.updateEmpleadoByIdentity({registro_id:registroId},{estatus:nuevo});
        await cargarEmpleadosCheongWoon();
    }catch(e){ alert('Error al actualizar estatus: '+e.message); }
    finally{ btn.disabled=false; }
}

document.addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.btn-estatus'); if(!btn) return; toggleEstatus(btn);
});

function obtenerEmpleadosSeleccionados(){
    const out = [];
    document.querySelectorAll('.checkbox-gafete:checked').forEach(i=>{
        out.push({ registro_id: i.dataset.registroId, nombre: i.dataset.nombre, no_empleado: i.dataset.noEmpleado });
    });
    return out;
}

function crearHojaGafetes(empleados){
    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    const detalles = empleados.map(sel=>{
        const full = empleadosCache.find(e=>String(e.registro_id||'')===String(sel.registro_id||'')) || {};
        return { registro_id: sel.registro_id || full.registro_id || '', nombre_completo: full.nombre_completo || full.nombre || sel.nombre || '', area: full.area || '' };
    });
    const styleBlock = `
    <style>
    :root{--badge-width:62mm;--badge-height:87mm;--primary-blue:#2563eb}
    html,body{margin:0;padding:0;background:#fff;color:#000}
    .sheet{width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
    .page{width:8.5in;height:11in;box-sizing:border-box;padding:0;margin:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12mm;align-items:center;justify-items:center;height:100%;padding:18mm}
    .badge-card{width:var(--badge-width);height:var(--badge-height);box-sizing:border-box;background:#fff;border:2px dashed #94a3b8;overflow:hidden;position:relative}
    .badge-inner{padding:8mm;font-family:Arial,Helvetica,sans-serif}
    .badge-title{font-weight:800;color:var(--primary-blue);font-size:14pt}
    .badge-name{font-weight:800;font-size:12pt;margin-top:6mm}
    .badge-no{font-size:10pt;margin-top:3mm}
    .rotated{transform:rotate(90deg);transform-origin:center}
    @media print{ .sheet{height:100vh} .page{page-break-after:always} }
    </style>`;

    let badgesHtml = '';
    detalles.slice(0,4).forEach(emp=>{
        badgesHtml += `
        <div class="badge-card rotated">
            <div class="badge-inner">
                <div class="badge-title">GAFETE</div>
                <div class="badge-name">${escapeHtml(emp.nombre_completo)}</div>
                <div class="badge-no">No. Empleado: ${escapeHtml(emp.registro_id || '')}</div>
                <div style="position:absolute;bottom:8mm;left:8mm;font-size:9pt;color:#334155">${escapeHtml(emp.area)}</div>
            </div>
        </div>`;
    });

    const html = `<!doctype html><html><head><meta charset="utf-8"><title>Gafettes</title>${styleBlock}</head><body><div class="sheet"><div class="page"><div class="grid">${badgesHtml}</div></div></div></body></html>`;
    return Promise.resolve(html);
}

async function descargarGafettes(){
    const seleccionados = obtenerEmpleadosSeleccionados();
    if(!seleccionados.length){ alert('Selecciona al menos un empleado'); return; }
    const chunks = [];
    for(let i=0;i<seleccionados.length;i+=4) chunks.push(seleccionados.slice(i,i+4));
    try{
        const pages = await Promise.all(chunks.map(c=>crearHojaGafetes(c)));
        const styleMatch = pages[0].match(/<style>[\s\S]*?<\/style>/i);
        const styleHtml = styleMatch? styleMatch[0] : '<style>html,body{margin:0;padding:0}</style>';
        const grids = pages.map(p=>{ const m = p.match(/<div class="grid">([\s\S]*?)<\/div>/i); return m? m[0] : ''; }).filter(Boolean);
        const win = window.open('','_blank');
        if(!win){ alert('Permite popups para imprimir/descargar'); return; }
        const parts = ['<!doctype html><html><head><meta charset="utf-8"><title>Gafettes</title>', styleHtml, '</head><body>'];
        grids.forEach(gridHtml=>{
            const inner = gridHtml.replace(/^<div class="grid">/i,'').replace(/<\/div>$/i,'');
            parts.push('<div class="page"><div class="grid">', inner, '</div></div>');
        });
        parts.push('</body></html>');
        win.document.write(parts.join(''));
        win.document.close();
        setTimeout(()=>{ try{ win.focus(); win.print(); }catch(e){console.warn(e);} },600);
    }catch(e){ alert('Error generando gafetes: '+e.message); }
}

filterEstatus.addEventListener('change', ()=>{ statusFilter = filterEstatus.value||'TODOS'; renderTabla(); });
buscador.addEventListener('keyup', function(){ searchQuery = String(this.value||'').trim().toLowerCase(); renderTabla(); });

btnDescargarGafettes && btnDescargarGafettes.addEventListener('click', descargarGafettes);

// Initialize
document.addEventListener('DOMContentLoaded', ()=>{ cargarEmpleadosCheongWoon(); if(window.DataManager) window.DataManager.subscribeVistas(cargarEmpleadosCheongWoon); });

</script>
</body>
</html>
